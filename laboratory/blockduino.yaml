    config:
      content: |-
        # Introduction to Arduino Programming: Understanding Serial Communication

        Arduino is an open-source electronics platform based on easy-to-use
        hardware and software. It's intended for anyone making interactive
        projects. One of the fundamental aspects of Arduino programming involves
        understanding how to communicate with the Arduino board via serial
        communication, which is crucial for projects requiring data exchange
        between the Arduino and a computer or other devices.

        ## Featured Code Explanation:

        The blocks next to this text are a simple example of using Arduino's
        serial communication: they read what you type into the serial input of
        the simulator and answer it. Type `send` and press Send: the Arduino
        answers `identified`, anything else gets `unknown`.

        **Breaking down the blocks:**

        1. **Setup:**

            - The "Serial init" block becomes `Serial.begin(9600);` in `setup()`,
              which runs once when the program starts. It starts serial
              communication at 9600 bits per second.

        2. **Loop:**

            - All other blocks end up in `loop()`, which runs again and again
              as long as the Arduino is powered on.

        3. **Reading the input:**

            - `str = textTrim(Serial.readStringUntil(';'));`
              reads characters until a `;` arrives or one second passes without
              new ones, and stores them in the text variable `str`.
            - The "trim" block removes spaces and the line ending at both ends.
              The serial monitor ends every line you send with a newline, so
              without it `str` would be `"send\n"` and never equal `"send"`.

        4. **Responding:**

            - If `str` is empty, nothing arrived within the second and the
              program reads again.
            - If `str` equals "send", `Serial.println("identified");` answers,
              otherwise `Serial.println("unknown");`.

        ## What is Serial Used For?

        In Arduino projects, the serial communication is commonly used for:

        - **Debugging**: By sending data from the Arduino to a computer,
          developers can monitor what is happening inside the program and
          troubleshoot issues, similar to using `print` statements in other
          programming languages. 

        - **Communication**: Arduino can communicate with other devices including
          sensors, computers, or even other Arduino boards, which is essential for
          projects like weather stations, where data must be sent from sensors to a
          processing display. .

        - **Control**: Users can send commands from a computer to the Arduino to
           control devices connected to it, such as motors, LEDs, or relays.
